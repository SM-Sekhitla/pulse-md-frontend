name: 'Builds and deploy ui'

on:
  push:
    branches:
      - main


jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      -
        name: Checkout repository
        uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Frontend checks
        run: |
          npm ci
          npm run check
          npm run build
      - name: Check production API target
        env:
          API_TARGET: ${{ vars.VITE_API_TARGET }}
        run: |
          test -n "$API_TARGET" || { echo "Set the VITE_API_TARGET repository variable to your backend HTTPS URL"; exit 1; }
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api/v1
            VITE_API_TARGET=${{ vars.VITE_API_TARGET }}
            VITE_GEOAPIFY_API_KEY=${{ secrets.VITE_GEOAPIFY_API_KEY }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_IMAGE }}:latest
            ${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_IMAGE }}:${{ github.sha }}

      - name: Deploy
        # Only run this step if the branch is subscription

        if: github.ref == 'refs/heads/main'
        env:
          deploy_key: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

        run: |
          curl --fail --show-error --silent "$deploy_key"
