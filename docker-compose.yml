services:
  pulse-md-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_API_TARGET: ${VITE_API_TARGET:?Set VITE_API_TARGET to the backend origin, for example http://host.docker.internal:5000}
        VITE_FRONTEND_BASE_URL: ${VITE_FRONTEND_BASE_URL:-}
        VITE_GIT_VERSION: ${VITE_GIT_VERSION:-dev}
    env_file:
      - path: .env
        required: false
    environment:
      VITE_API_TARGET: ${VITE_API_TARGET:?Set VITE_API_TARGET to the backend origin, for example http://host.docker.internal:5000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
